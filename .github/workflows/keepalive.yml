name: Keep Render instance awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          if [ -z "${{ vars.KEEPALIVE_URL }}" ]; then
            echo "KEEPALIVE_URL repo variable is not set yet — skipping ping."
            echo "Set it under Settings > Secrets and variables > Actions > Variables"
            echo "to your Render URL (e.g. https://fakescope.onrender.com) once deployed."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${{ vars.KEEPALIVE_URL }}/health")
          echo "Health check responded with HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            echo "Unexpected response code, but not failing the job (Render may be cold-starting)."
          fi
