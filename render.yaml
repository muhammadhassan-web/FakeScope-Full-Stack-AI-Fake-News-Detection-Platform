services:
  - type: web
    name: fakescope
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
